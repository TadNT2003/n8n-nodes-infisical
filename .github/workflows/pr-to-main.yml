name: PR to main branch check

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    name: Require PR from dev or release
    runs-on: ubuntu-latest
    steps:
      - name: Fail if source branch is not dev or release
        if: github.head_ref != 'dev' && github.head_ref != 'release'
        run: |
          echo "PRs to main must come from the 'dev' or 'release' branch."
          echo "This PR is from '${{ github.head_ref }}'."
          exit 1

      - name: Source branch is valid
        run: echo "Source branch check passed."

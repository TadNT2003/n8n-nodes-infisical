name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  validate-tag:
    name: Validate tag is on release
    runs-on: ubuntu-latest
    outputs:
      on-release: ${{ steps.check.outputs.on-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is reachable from release
        id: check
        run: |
          git fetch origin release
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "on-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish package
    needs: validate-tag
    if: needs.validate-tag.outputs.on-release == 'true'
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Build and lint
        run: npm run prepublishOnly

      - name: Publish
        run: npm publish --access public
